<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Placed</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }
      .order-shell {
        border: 1px solid #222;
        margin: 12px;
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <section class="order-shell">
      <h2>Order Placed!</h2>
      <p>Thank you for your purchase.</p>
    </section>
    <script>
      const FRAME_ID = "order-placed";

      const notifyHostHeight = () => {
        const contentHeight = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight,
        );
        window.parent.postMessage(
          {
            type: "iframe:resize",
            payload: {
              frameId: FRAME_ID,
              height: contentHeight,
            },
          },
          "*",
        );
      };

      window.addEventListener("load", notifyHostHeight);
      window.addEventListener("resize", notifyHostHeight);
      requestAnimationFrame(notifyHostHeight);
    </script>
  </body>
</html>
