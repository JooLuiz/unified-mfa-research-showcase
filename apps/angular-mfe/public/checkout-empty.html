<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Empty</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }

      .checkout-empty-shell {
        border: 1px solid #222;
        margin: 12px;
        padding: 20px;
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
      }

      .checkout-empty-shell button {
        min-height: 36px;
        padding: 0.4rem 0.85rem;
        border: 1px solid #333;
        background: #f4f4f4;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <section class="checkout-empty-shell">
      <h2>There are no items in your cart</h2>
      <p>Please add some items to your cart to proceed</p>
      <button id="goBackToShoppingButton">Go Back to Shopping</button>
    </section>
    <script>
      const FRAME_ID = "checkout-empty";
      const goBackToShoppingButton = document.getElementById(
        "goBackToShoppingButton",
      );

      const notifyHostHeight = () => {
        const contentHeight = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight,
        );
        window.parent.postMessage(
          {
            type: "iframe:resize",
            payload: {
              frameId: FRAME_ID,
              height: contentHeight,
            },
          },
          "*",
        );
      };

      window.addEventListener("load", notifyHostHeight);
      window.addEventListener("resize", notifyHostHeight);
      requestAnimationFrame(notifyHostHeight);

      goBackToShoppingButton.addEventListener("click", () => {
        window.parent.postMessage(
          {
            type: "checkout:go-shopping",
          },
          "*",
        );
      });
    </script>
  </body>
</html>
