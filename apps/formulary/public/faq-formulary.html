<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agnostic Formulary</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
      }
      .formulary-shell {
        border: 1px solid #222;
        margin: 12px;
        padding: 20px;
        display: grid;
        gap: 10px;
      }
      .formulary-shell input,
      .formulary-shell select,
      .formulary-shell textarea {
        width: 100%;
        border: 1px solid #555;
        min-height: 34px;
        padding: 4px 8px;
        font-family: inherit;
        font-size: inherit;
      }
      .formulary-shell textarea {
        min-height: 80px;
        resize: vertical;
      }
      .formulary-shell button {
        min-height: 36px;
        border: 1px solid #333;
        background: #f4f4f4;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="formularyRoot"></div>
    <script src="/agnostic-formulary.js"></script>
  </body>
</html>
